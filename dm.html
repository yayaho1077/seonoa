{id:'seulbi',name:'한슬비',handle:'seulbi',image:'womanc1.png',time:'어제',preview:'늦었어 누나 얼른 자 😌',days:[{date:'새벽 12:48',messages:[['them','서노아\n너 오늘 누구 만났어?'],['me','오늘? 운동 끝나고 밥 먹었는데'],['them','누구랑?'],['me','왜요 누나\n무슨 일 있어?'],['them','아니 그냥 궁금해서ㅋㅋ\n말 못 할 사람이야?'],['me','그런 건 아니고\n굳이 얘기할 일도 아니니까'],['them','와 서운한데?\n우리 사이에 그것도 비밀이야?'],['me','비밀이랑 사생활은 좀 다르잖아 🙂'],['them','ㅋㅋㅋ 알았다 알았어'],['me','누나도 내가 매번 누구 만나는지 물어보면 귀찮을걸'],['them','맞는 말이라 더 짜증 나네'],['me','늦었어 누나\n얼른 자 😌']]}]},
{id:'harang',name:'모하랑',handle:'harang',image:'womanb1.png',time:'어제',preview:'오늘 고생 많았어 너무 마음 쓰지 말고 푹 자',days:[{date:'오후 9:06',messages:[['them','오빠 나 오늘 진짜 우울했어ㅠㅠ'],['me','왜 실습 때문에?'],['them','응... 완전 혼났어'],['me','속상했겠다\n밥은 먹었어?'],['them','응 먹었어!\n근데 오빠 목소리 들으면 기분 좋아질 것 같아'],['me','지금은 통화 어렵네\n내일 훈련 끝나면 연락할게'],['them','힝 ㅠㅠ\n오빠는 내가 보고 싶다고 하면 안 보고 싶어?'],['me','하랑아\n지금 듣고 싶은 말 정해놓고 물어보는 거지? 🙂'],['them','...티 나?'],['me','응 좀 나네\n귀엽긴 한데 듣고 싶은 말만 해주고 싶진 않아'],['them','오빠 너무해 ㅠㅠ'],['me','오늘 고생 많았어\n너무 마음 쓰지 말고 푹 자']]}]},
{id:'serin',name:'선세린',handle:'serin',image:'womana1.png',time:'화요일',preview:'오해할 만한 사진은 아니니까 걱정하지 마',days:[{date:'밤 11:21',messages:[['them','오빠'],['me','응 세린아'],['them','아까 올린 스토리요\n여자랑 찍은 사진 내려주면 안 돼요?'],['me','왜? 무슨 문제 있어?'],['them','그냥 보기 싫어서요\n사람들이 오해하잖아요'],['me','아 그랬구나\n근데 팀 행사 사진이라 내릴 생각은 없어'],['them','제가 싫다는데도요?'],['me','네가 싫은 마음은 이해해\n\n근데 그걸 이유로 내 사진을 내리라고 하는 건 다른 얘기지 🙂'],['them','...알겠어요'],['me','응\n오해할 만한 사진은 아니니까 걱정하지 마']]}]},

function avatar(p){const a=document.createElement('div');a.className='avatar'+(!p.image?' fallback':'');if(p.image){const img=document.createElement('img');img.src=root+p.image;img.alt=p.name;const setting=portraitSettings[p.id];if(setting){img.style.objectPosition=setting.position;img.style.transform='scale(1)';img.style.transformOrigin='center center';a.style.background='#eee9e8'}img.onerror=()=>{img.remove();a.classList.add('fallback');a.textContent=p.name.slice(-1)};a.append(img)}else a.textContent='U';return a}
const threads=document.getElementById('threads');people.forEach(p=>{const btn=document.createElement('button');btn.className='thread';btn.type='button';btn.setAttribute('aria-label',p.name+' 대화 열기');btn.append(avatar(p));const info=document.createElement('div');info.className='thread-info';const name=document.createElement('div');name.className='thread-name';name.textContent=p.name;const prev=document.createElement('div');prev.className='thread-preview';prev.textContent=p.preview+' · '+p.time;info.append(name,prev);btn.append(info);if(p.id==='user'){const d=document.createElement('div');d.className='dot';btn.append(d)}btn.onclick=()=>openChat(p.id);threads.append(btn)});
function openChat(id){const p=people.find(x=>x.id===id);if(!p)return;document.getElementById('inbox').classList.add('hidden');document.getElementById('chat').classList.add('open');document.getElementById('chatTitle').textContent=p.name;const ca=document.getElementById('chatAvatar');ca.replaceWith(Object.assign(avatar(p),{id:'chatAvatar'}));const body=document.getElementById('chatBody');body.replaceChildren();const intro=document.createElement('div');intro.className='profile-intro';intro.append(avatar(p));const b=document.createElement('b');b.textContent=p.name;const small=document.createElement('small');small.textContent='Instagram · @'+p.handle;intro.append(b,small);body.append(intro);p.days.forEach(day=>{const d=document.createElement('div');d.className='day';d.textContent=day.date;body.append(d);day.messages.forEach(([who,msg])=>{const row=document.createElement('div');row.className='bubble-row '+(who==='me'?'mine':'theirs');const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=msg;row.append(bubble);body.append(row)})});window.scrollTo(0,0);history.pushState({chat:id},'', '#'+id)}
function closeChat(fromPop=false){document.getElementById('chat').classList.remove('open');document.getElementById('inbox').classList.remove('hidden');window.scrollTo(0,0);if(!fromPop&&location.hash)history.pushState({},'',location.pathname+location.search)}window.addEventListener('popstate',()=>{const id=location.hash.slice(1);if(id&&people.some(p=>p.id===id)){openChatWithoutHistory(id)}else closeChat(true)});function openChatWithoutHistory(id){openChat(id);history.replaceState({chat:id},'', '#'+id)}if(location.hash){const id=location.hash.slice(1);if(people.some(p=>p.id===id))openChatWithoutHistory(id)}
